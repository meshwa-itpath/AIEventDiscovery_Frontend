<div class="search-page-bg">


  <!-- ── Main Content ───────────────────────────────────────── -->
  <main class="search-page-content">
    
    <!-- Search Results Section -->
    <section class="mt-4 px-4" *ngIf="searchResults() !== null">
      <div class="results-header flex align-items-center justify-content-between mb-4">
        <div class="flex align-items-center gap-4">
          <h2 class="text-2xl font-bold section-title m-0" style="color: #e6edf3;">{{ pageHeading }}</h2>
          
          <app-local-search
            placeholder="Filter these results..."
            [query]="localSearchQuery()"
            (queryChange)="onLocalSearchChanged($event)"
          />
        </div>
        <div class="flex gap-2">
          <p-button
            *ngIf="hasActiveFilters()"
            icon="pi pi-times"
            [outlined]="true"
            severity="danger"
            styleClass="border-round-xl"
            (onClick)="clearFilters()"
            title="Clear Filters"
            label="Clear Filters"
          />
          <p-button
            *ngIf="showFilterButton()"
            label="Filters"
            icon="pi pi-sliders-h"
            [outlined]="true"
            severity="secondary"
            styleClass="filter-trigger-btn border-round-xl"
            (onClick)="filterDrawerVisible.set(true)"
          />
        </div>
      </div>
      
      <!-- Empty State -->
      <div *ngIf="searchResults()!.length === 0 && !isSearching()" class="text-gray-400">
        <ng-container *ngIf="searchQueryStr.trim(); else defaultEmptyState">
          No events found for "{{ searchQueryStr }}".
        </ng-container>
        <ng-template #defaultEmptyState>
          No recommended events are available right now.
        </ng-template>
      </div>

      <!-- Results Grid -->
      <div class="events-grid" *ngIf="searchResults()!.length > 0">
        <div class="event-card-wrapper" *ngFor="let event of searchResults()">
          <app-event-card
            [event]="event"
            [showMatchBadge]="true"
            (cardClick)="navigateToEventDetail($event)"
          />
        </div>
      </div>
      
      <!-- Load More Button -->
      <div class="flex justify-content-center mt-4 mb-6" *ngIf="hasMore()">
        <p-button
          label="Load More"
          icon="pi pi-chevron-down"
          iconPos="right"
          [loading]="isLoadingMore()"
          [outlined]="true"
          severity="secondary"
          (onClick)="loadMoreResults()"
          styleClass="border-round-xl px-5"
        />
      </div>
    </section>


    <!-- Filter Drawer -->
    <p-drawer
      [(visible)]="filterDrawerVisible"
      position="right"
      styleClass="filter-drawer"
      header="Filters"
      [style]="{ width: '25rem' }"
    >
      <app-filter-form (filtersApplied)="onFiltersApplied($event)" />
    </p-drawer>
  </main>

  <footer class="search-footer">
    <span>© 2026 EventFind AI</span>
    <div class="footer-links">
      <a href="javascript:void(0)">Privacy</a>
      <a href="javascript:void(0)">Terms</a>
      <a href="javascript:void(0)">Contact</a>
    </div>
  </footer>

</div>
