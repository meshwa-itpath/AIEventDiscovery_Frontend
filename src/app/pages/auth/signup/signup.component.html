<div class="signup-bg flex align-items-center justify-content-center min-h-screen p-4">
  <div class="signup-card w-full">
    
    <!-- ── Header / Logo ── -->
    <div class="flex align-items-center gap-2 px-5 py-3 logo-header cursor-pointer" routerLink="/">
      <i class="pi pi-calendar text-primary text-xl"></i>
      <span class="text-xl font-bold brand-name">EventFind</span>
    </div>

    <!-- ── Form Body ── -->
    <div class="px-5 py-5">
      <div class="text-center mb-4">
        <h2 class="auth-title mb-1">Create account</h2>
        <p class="auth-subtitle text-sm">Start discovering events today</p>
      </div>

      <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-3">
        
        <!-- First Name & Last Name (2 Column Flex Row) -->
        <div class="flex gap-3 flex-column sm:flex-row">
          <!-- First Name -->
          <div class="flex flex-column gap-1 flex-1">
            <label for="firstName" class="label-text">First Name</label>
            <input
              pInputText
              id="firstName"
              type="text"
              formControlName="firstName"
              placeholder="John"
              class="w-full form-input"
              [class.ng-invalid]="isControlInvalid('firstName')"
              [class.ng-dirty]="isControlInvalid('firstName')"
            />
            <div *ngIf="isControlInvalid('firstName')" class="error-container">
              <span *ngIf="signupForm.get('firstName')?.errors?.['required']" class="text-xs error-text">
                Required.
              </span>
            </div>
          </div>

          <!-- Last Name -->
          <div class="flex flex-column gap-1 flex-1">
            <label for="lastName" class="label-text">Last Name</label>
            <input
              pInputText
              id="lastName"
              type="text"
              formControlName="lastName"
              placeholder="Doe"
              class="w-full form-input"
              [class.ng-invalid]="isControlInvalid('lastName')"
              [class.ng-dirty]="isControlInvalid('lastName')"
            />
            <div *ngIf="isControlInvalid('lastName')" class="error-container">
              <span *ngIf="signupForm.get('lastName')?.errors?.['required']" class="text-xs error-text">
                Required.
              </span>
            </div>
          </div>
        </div>

        <!-- Email Input -->
        <div class="flex flex-column gap-1">
          <label for="email" class="label-text">Email Address</label>
          <input
            pInputText
            id="email"
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            class="w-full form-input"
            [class.ng-invalid]="isControlInvalid('email')"
            [class.ng-dirty]="isControlInvalid('email')"
          />
          <div *ngIf="isControlInvalid('email')" class="error-container">
            <span *ngIf="signupForm.get('email')?.errors?.['required']" class="text-xs error-text">
              Email is required.
            </span>
            <span *ngIf="signupForm.get('email')?.errors?.['email']" class="text-xs error-text">
              Please enter a valid email address.
            </span>
          </div>
        </div>

        <!-- Password Input -->
        <div class="flex flex-column gap-1">
          <label for="password" class="label-text">Password</label>
          <p-password
            id="password"
            formControlName="password"
            [toggleMask]="true"
            placeholder="Min. 8 characters"
            styleClass="w-full"
            inputStyleClass="w-full form-input"
            [class.ng-invalid]="isControlInvalid('password')"
            [class.ng-dirty]="isControlInvalid('password')"
          />
          <div *ngIf="isControlInvalid('password')" class="error-container">
            <span *ngIf="signupForm.get('password')?.errors?.['required']" class="text-xs error-text">
              Password is required.
            </span>
            <span *ngIf="signupForm.get('password')?.errors?.['minlength']" class="text-xs error-text">
              Password must be at least 8 characters long.
            </span>
          </div>
        </div>

        <!-- Submit Button -->
        <p-button
          type="submit"
          label="Create account"
          severity="contrast"
          styleClass="w-full mt-2"
        />

        <!-- Secondary Link -->
        <div class="text-center mt-2">
          <span class="hint-text text-sm">Already have an account? </span>
          <a routerLink="/auth/login" class="nav-link text-sm font-semibold">Log in</a>
        </div>

      </form>
    </div>

  </div>
</div>
