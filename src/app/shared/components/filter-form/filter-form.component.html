<form [formGroup]="filterForm" class="filter-form-container">
  
  <!-- Level -->
  <div class="filter-section">
    <div class="filter-section-title">Level</div>
    <div class="flex flex-row flex-wrap gap-3 mt-2">
      <div class="flex align-items-center">
        <p-checkbox formControlName="level" value="Beginner" inputId="level1" />
        <label for="level1" class="ml-2 filter-option-label">Beginner</label>
      </div>
      <div class="flex align-items-center">
        <p-checkbox formControlName="level" value="Intermediate" inputId="level2" />
        <label for="level2" class="ml-2 filter-option-label">Intermediate</label>
      </div>
      <div class="flex align-items-center">
        <p-checkbox formControlName="level" value="Advanced" inputId="level3" />
        <label for="level3" class="ml-2 filter-option-label">Advanced</label>
      </div>
    </div>
  </div>
  <p-divider styleClass="filter-divider" />

  <!-- Mode -->
  <div class="filter-section">
    <div class="filter-section-title">Mode</div>
    <div class="flex flex-row flex-wrap gap-3 mt-2">
      <div class="flex align-items-center">
        <p-checkbox formControlName="mode" value="Online" inputId="mode1" />
        <label for="mode1" class="ml-2 filter-option-label">Online</label>
      </div>
      <div class="flex align-items-center">
        <p-checkbox formControlName="mode" value="Offline" inputId="mode2" />
        <label for="mode2" class="ml-2 filter-option-label">Offline</label>
      </div>
      <div class="flex align-items-center">
        <p-checkbox formControlName="mode" value="Hybrid" inputId="mode3" />
        <label for="mode3" class="ml-2 filter-option-label">Hybrid</label>
      </div>
    </div>
  </div>
  <p-divider styleClass="filter-divider" />

  <!-- Category -->
  <div class="filter-section">
    <div class="filter-section-title">Category</div>
    <div class="flex flex-row flex-wrap gap-3 mt-2">
      <div class="flex align-items-center">
        <p-checkbox formControlName="category" value="Backend Development" inputId="cat1" />
        <label for="cat1" class="ml-2 filter-option-label">Backend Development</label>
      </div>
      <div class="flex align-items-center">
        <p-checkbox formControlName="category" value="Frontend Development" inputId="cat2" />
        <label for="cat2" class="ml-2 filter-option-label">Frontend Development</label>
      </div>
      <div class="flex align-items-center">
        <p-checkbox formControlName="category" value="DevOps" inputId="cat3" />
        <label for="cat3" class="ml-2 filter-option-label">DevOps</label>
      </div>
      <div class="flex align-items-center">
        <p-checkbox formControlName="category" value="Mobile" inputId="cat4" />
        <label for="cat4" class="ml-2 filter-option-label">Mobile</label>
      </div>
      <div class="flex align-items-center">
        <p-checkbox formControlName="category" value="AI/ML" inputId="cat5" />
        <label for="cat5" class="ml-2 filter-option-label">AI/ML</label>
      </div>
    </div>
  </div>
  <p-divider styleClass="filter-divider" />

  <!-- Event Type -->
  <div class="filter-section">
    <div class="filter-section-title">Event Type</div>
    <div class="flex flex-row flex-wrap gap-3 mt-2">
      <div class="flex align-items-center">
        <p-checkbox formControlName="eventType" value="Workshop" inputId="et1" />
        <label for="et1" class="ml-2 filter-option-label">Workshop</label>
      </div>
      <div class="flex align-items-center">
        <p-checkbox formControlName="eventType" value="Conference" inputId="et2" />
        <label for="et2" class="ml-2 filter-option-label">Conference</label>
      </div>
      <div class="flex align-items-center">
        <p-checkbox formControlName="eventType" value="Networking Event" inputId="et3" />
        <label for="et3" class="ml-2 filter-option-label">Networking Event</label>
      </div>
      <div class="flex align-items-center">
        <p-checkbox formControlName="eventType" value="Webinar" inputId="et4" />
        <label for="et4" class="ml-2 filter-option-label">Webinar</label>
      </div>
      <div class="flex align-items-center">
        <p-checkbox formControlName="eventType" value="Bootcamp" inputId="et5" />
        <label for="et5" class="ml-2 filter-option-label">Bootcamp</label>
      </div>
    </div>
  </div>
  <p-divider styleClass="filter-divider" />

  <!-- City -->
  <div class="filter-section">
    <div class="filter-section-title">City</div>
    <input pInputText type="text" formControlName="city" placeholder="E.g. Hyderabad" class="w-full mt-2" />
  </div>
  <p-divider styleClass="filter-divider" />

  <!-- Country -->
  <div class="filter-section">
    <div class="filter-section-title">Country</div>
    <input pInputText type="text" formControlName="country" placeholder="E.g. India" class="w-full mt-2" />
  </div>
  <p-divider styleClass="filter-divider" />

  <!-- Dates -->
  <div class="filter-section">
    <div class="filter-section-title">Start Date</div>
    <p-datepicker formControlName="startDate" [showIcon]="true" placeholder="Select start date" styleClass="w-full mt-2" [showClear]="true" />
  </div>
  <p-divider styleClass="filter-divider" />

  <div class="filter-section">
    <div class="filter-section-title">End Date</div>
    <p-datepicker formControlName="endDate" [showIcon]="true" placeholder="Select end date" styleClass="w-full mt-2" [showClear]="true" />
  </div>
  <p-divider styleClass="filter-divider" />

  <!-- Technologies -->
  <div class="filter-section">
    <div class="filter-section-title">Technologies</div>
    <p-multiSelect [options]="techOptions" formControlName="technologies" optionLabel="label" optionValue="value" placeholder="Select Technologies" styleClass="w-full mt-2" display="chip" />
  </div>
  <p-divider styleClass="filter-divider" />

  <!-- Min Rating -->
  <div class="filter-section">
    <div class="flex align-items-center justify-content-between">
      <div class="filter-section-title mb-0">Minimum Rating</div>
      <p-chip label="{{currentRating >= 1 ? currentRating.toFixed(1) : 'Any'}}" icon="pi pi-star-fill" styleClass="rating-chip" />
    </div>
    <div class="mt-3 px-2 mb-2">
      <p-slider formControlName="rating" [min]="0" [max]="5" [step]="0.5" />
      <div class="flex justify-content-between mt-2 text-xs" style="color: #6e7681;">
        <span>Any</span>
        <span>5.0</span>
      </div>
    </div>
  </div>

</form>

<!-- Sticky Footer -->
<div class="filter-footer flex gap-2">
  <div class="flex-1">
    <p-button label="Apply Filters" styleClass="w-full p-button-primary border-round-md" (onClick)="applyFilters()" />
  </div>
  <div class="flex-1">
    <p-button label="Reset" [outlined]="true" severity="secondary" styleClass="w-full border-round-md" (onClick)="triggerReset()" />
  </div>
</div>
