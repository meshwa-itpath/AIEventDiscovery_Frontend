<form [formGroup]="filterForm" class="filter-form-container">
  
  <ng-container *ngFor="let group of filterGroups; let last = last">
    <div class="filter-section">
      <div class="filter-section-title">{{ group.title }}</div>
      <div class="flex flex-row flex-wrap gap-3 mt-2">
        <div *ngFor="let option of group.options" class="flex align-items-center">
          <p-checkbox
            [formControl]="getFilterControl(group.controlName)"
            [value]="option.value"
            [inputId]="getOptionInputId(group.controlName, option.value)"
          />
          <label
            [for]="getOptionInputId(group.controlName, option.value)"
            class="ml-2 filter-option-label"
          >
            {{ option.label }}
          </label>
        </div>
      </div>
    </div>
    <p-divider class="filter-divider" />
  </ng-container>

  <!-- City -->
  <div class="filter-section">
    <div class="filter-section-title">City</div>
    <input pInputText type="text" formControlName="city" placeholder="E.g. Hyderabad" class="w-full mt-2" />
  </div>
  <p-divider class="filter-divider" />

  <!-- Country -->
  <div class="filter-section">
    <div class="filter-section-title">Country</div>
    <input pInputText type="text" formControlName="country" placeholder="E.g. India" class="w-full mt-2" />
  </div>
  <p-divider styleClass="filter-divider" />

  <!-- Dates -->
  <div class="filter-section">
    <div class="filter-section-title">Start Date</div>
    <p-datepicker formControlName="startDate" [showIcon]="true" placeholder="Select start date" styleClass="w-full mt-2" [showClear]="true" />
  </div>
  <p-divider styleClass="filter-divider" />

  <div class="filter-section">
    <div class="filter-section-title">End Date</div>
    <p-datepicker formControlName="endDate" [showIcon]="true" placeholder="Select end date" styleClass="w-full mt-2" [showClear]="true" />
  </div>
  <p-divider styleClass="filter-divider" />

  <!-- Technologies -->
  <div class="filter-section">
    <div class="filter-section-title">Technologies</div>
    <p-multiSelect [options]="techOptions" formControlName="technologies" optionLabel="label" optionValue="value" placeholder="Select Technologies" styleClass="w-full mt-2" display="chip" />
  </div>
  <p-divider styleClass="filter-divider" />

  <!-- Min Rating -->
  <div class="filter-section">
    <div class="flex align-items-center justify-content-between">
      <div class="filter-section-title mb-0">Minimum Rating</div>
      <p-chip label="{{currentRating >= 1 ? currentRating.toFixed(1) : 'Any'}}" icon="pi pi-star-fill" styleClass="rating-chip" />
    </div>
    <div class="mt-3 px-2 mb-2">
      <p-slider formControlName="rating" [min]="0" [max]="5" [step]="0.5" />
      <div class="flex justify-content-between mt-2 text-xs" style="color: #6e7681;">
        <span>Any</span>
        <span>5.0</span>
      </div>
    </div>
  </div>

</form>

<!-- Sticky Footer -->
<div class="filter-footer flex gap-2">
  <div class="flex-1">
    <p-button label="Apply Filters" styleClass="w-full p-button-primary border-round-md" (onClick)="applyFilters()" />
  </div>
  <div class="flex-1">
    <p-button label="Reset" [outlined]="true" severity="secondary" styleClass="w-full border-round-md" (onClick)="triggerReset()" />
  </div>
</div>
