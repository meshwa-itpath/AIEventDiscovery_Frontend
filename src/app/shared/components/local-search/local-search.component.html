<p-iconfield styleClass="local-search-field">
  <p-inputicon styleClass="pi pi-search" />
  <input
    pInputText
    type="text"
    [placeholder]="placeholder"
    class="local-search-input p-inputtext-sm pr-5"
    [ngModel]="query"
    (ngModelChange)="onQueryChange($event)"
  />
  <i *ngIf="query" 
     class="pi pi-times" 
     (click)="clearSearch()"
     style="cursor: pointer; position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); color: #8b949e;"
     title="Clear filter">
  </i>
</p-iconfield>
