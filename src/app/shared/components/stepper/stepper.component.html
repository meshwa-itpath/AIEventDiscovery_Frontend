<div class="stepper-container">

  <!-- ── Stepper Header & Progress Track ── -->
  <div class="stepper-header-wrapper">
    <div class="stepper-header">

      <!-- Background connecting track line -->
      <div class="stepper-track-bg"></div>
      <!-- Filled connecting progress line -->
      <div class="stepper-track-fill" [style.width.%]="progressPercentage"></div>

      <!-- Step Nodes -->
      <div
        class="step-item"
        *ngFor="let step of steps; let i = index"
        [class.completed]="isStepCompleted(i)"
        [class.active]="isStepActive(i)"
        [class.upcoming]="!isStepCompleted(i) && !isStepActive(i)"
        [class.clickable]="isStepCompleted(i) && allowDirectJump"
        (click)="goToStep(i)"
      >
        <!-- Node Circle -->
        <div class="step-node">
          <i class="pi pi-check" *ngIf="isStepCompleted(i)"></i>
          <span *ngIf="!isStepCompleted(i)">{{ i + 1 }}</span>
        </div>

        <!-- Node Labels -->
        <div class="step-label-group">
          <span class="step-label-title">{{ step.title }}</span>
          <span class="step-label-subtitle" *ngIf="step.subtitle">{{ step.subtitle }}</span>
        </div>
      </div>

    </div>
  </div>

  <!-- ── Step Content Projected Slot ── -->
  <div class="stepper-content">
    <ng-content></ng-content>
  </div>

  <!-- ── Stepper Footer Navigation Controls ── -->
  <div class="stepper-footer">
    <p-button
      type="button"
      label="Back"
      icon="pi pi-arrow-left"
      severity="secondary"
      [outlined]="true"
      [disabled]="isSubmitting || currentStepIndex === 0"
      [style.visibility]="currentStepIndex === 0 ? 'hidden' : 'visible'"
      styleClass="stepper-back-btn"
      (onClick)="onBack()"
    ></p-button>

    <p-button
      type="button"
      [label]="isSubmitting ? 'Saving...' : (isLastStep ? finishButtonText : nextButtonText)"
      [icon]="isSubmitting ? 'pi pi-spin pi-spinner' : (isLastStep ? 'pi pi-check' : 'pi pi-arrow-right')"
      [disabled]="isNextDisabled || isSubmitting"
      styleClass="p-button-primary"
      (onClick)="onNext()"
    ></p-button>
  </div>

</div>
